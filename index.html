<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physarum Decay Machine</title>

  <style>
    @font-face {
      font-family: 'Bai Jamjuree Local';
      src: url('BaiJamjuree-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --bg: #00FF00; 
      --panel-bg: rgba(15, 15, 15, 0.88);
      --text: rgba(255, 255, 255, 0.75); 
      --accent: #48b493; 
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background-color: var(--bg);
      font-family: 'Bai Jamjuree Local', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
    }
    #font-preload {
      position: absolute;
      opacity: 0;
      font-family: 'Bai Jamjuree Local';
      font-weight: normal;
    }
    canvas { display: block; }

    #ui-panel {
      position: absolute;
      top: 20px; left: 20px;
      width: 300px;
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      padding: 18px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      z-index: 10;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
    }
    h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 3px; color: rgba(255,255,255,0.9); }
    p.subtitle { font-size: 0.75rem; color: #888; margin-bottom: 16px; }

    .tab-row { display: flex; gap: 6px; margin-bottom: 14px; }
    .tab-btn {
      flex: 1; padding: 6px 0;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px; color: #aaa;
      font-size: 0.75rem; font-family: inherit;
      cursor: pointer; letter-spacing: 0.5px;
      transition: all 0.15s;
    }
    .tab-btn.active { background: rgba(72, 180, 147, 0.25); border-color: var(--accent); color: var(--accent); }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    .control-group { margin-bottom: 13px; }
    label {
      display: flex; justify-content: space-between;
      font-size: 0.82rem; margin-bottom: 4px; color: #ccc;
    }
    label.block-label { display: block; margin-bottom: 6px; }
    
    textarea {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.85); 
      padding: 9px; border-radius: 6px;
      font-family: inherit; outline: none; transition: border-color 0.2s;
      resize: vertical;
      min-height: 80px;
    }
    textarea:focus { border-color: var(--accent); }
    
    input[type="text"] {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.85); 
      padding: 9px; border-radius: 6px;
      font-family: inherit; outline: none; transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    
    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 42px;
      height: 38px;
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
      padding: 0;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; }

    input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }
    span.val { font-family: monospace; color: var(--accent); }

    hr.div { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 14px 0; }

    #drop-zone {
      width: 100%; min-height: 90px;
      border: 1.5px dashed rgba(255,255,255,0.2);
      border-radius: 8px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 6px;
      padding: 12px; cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: rgba(255,255,255,0.02); text-align: center;
    }
    #drop-zone:hover, #drop-zone.drag-over { border-color: var(--accent); background: rgba(72, 180, 147, 0.08); }
    #drop-zone svg { opacity: 0.45; }
    #drop-zone p { font-size: 0.75rem; color: #777; line-height: 1.45; }
    #drop-zone strong { color: #aaa; font-weight: 500; }
    #file-input { display: none; }

    #img-preview-wrap { display: none; position: relative; margin-top: 12px; }
    #img-preview { width: 100%; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); display: block; background: rgba(255,255,255,0.05);}
    #img-clear {
      position: absolute; top: 5px; right: 5px;
      width: 20px; height: 20px; border-radius: 50%;
      background: rgba(0,0,0,0.75); border: 1px solid rgba(255,255,255,0.2);
      color: #fff; font-size: 0.7rem; display: flex;
      align-items: center; justify-content: center; cursor: pointer;
    }
    #img-clear:hover { background: #c00; }
    
    .radio-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;}
    .radio-group label {
      display: flex; align-items: center; gap: 4px;
      font-size: 0.76rem; color: #bbb; cursor: pointer; margin-bottom: 0;
    }
    input[type="radio"] { accent-color: var(--accent); cursor: pointer; }

    /* Button Styles */
    .btn-primary {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }
    .btn-primary:hover { background: #5cd0ab; }
    .btn-primary:active { opacity: 0.8; }
    .btn-primary:disabled { background: #555; color: #aaa; cursor: not-allowed; }
    
    .status-text {
      font-size: 0.7rem; color: #888; text-align: center; margin-top: 6px; min-height: 14px;
    }
  </style>
</head>
<body>

<div id="font-preload">Load</div>

<div id="ui-panel">
  <h1>Physarum Model</h1>
  <p class="subtitle">Interactive Slime Mold Simulation</p>

  <div class="tab-row">
    <button class="tab-btn active" data-tab="text-tab">Text</button>
    <button class="tab-btn" data-tab="image-tab">Image</button>
  </div>

  <div class="tab-pane active" id="text-tab">
    <div class="control-group">
      <label class="block-label" for="textInput">Seed Text</label>
      <textarea id="textInput">BIODESIGN</textarea>
    </div>
    
    <div class="control-group">
      <label>Size<span class="val" id="textSizeVal">120</span></label>
      <input type="range" id="textSizeSlider" min="20" max="400" step="1" value="120">
    </div>
    <div class="control-group">
      <label>Position X<span class="val" id="textXVal">50%</span></label>
      <input type="range" id="textXSlider" min="0" max="100" step="1" value="50">
    </div>
    <div class="control-group">
      <label>Position Y<span class="val" id="textYVal">50%</span></label>
      <input type="range" id="textYSlider" min="0" max="100" step="1" value="50">
    </div>
  </div>

  <div class="tab-pane" id="image-tab">
    <div class="control-group">
      <label class="block-label">Upload Image</label>
      <div id="drop-zone">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <p><strong>Click to browse</strong> or drag &amp; drop<br>Image File</p>
        <input type="file" id="file-input" accept="image/*">
      </div>
      <div id="img-preview-wrap">
        <img id="img-preview" alt="preview">
        <div id="img-clear" title="Remove">✕</div>
      </div>
      <div id="img-status" class="status-text"></div>
    </div>
  </div>

  <div class="control-group">
    <label class="block-label">Background Color</label>
    <div style="display: flex; gap: 8px;">
      <input type="color" id="bgColorPicker" value="#00FF00" title="Pick a color">
      <input type="text" id="bgHexInput" value="#00FF00" style="flex: 1; font-family: monospace;" maxlength="7">
    </div>
  </div>

  <!-- NEW: Background Image Upload Control -->
  <div class="control-group">
    <label class="block-label">Background Image</label>
    <button id="bg-upload-btn" class="btn-primary" style="margin-top: 0; background: rgba(255,255,255,0.1); color: #fff;">Upload Image</button>
    <input type="file" id="bg-file-input" accept="image/*" style="display: none;">
    <button id="bg-clear-btn" class="btn-primary" style="margin-top: 5px; display: none; background: #c00; color: white;">Remove Image</button>
  </div>

  <div class="control-group">
    <label class="block-label">Spawn agents on</label>
    <div class="radio-group">
      <label><input type="radio" name="edge-mode" value="edge"> Edges only</label>
      <label><input type="radio" name="edge-mode" value="fill" checked> Filled</label>
    </div>
  </div>

  <hr class="div">

  <div class="control-group">
    <label>Speed<span class="val" id="speedVal">60 fps</span></label>
    <input type="range" id="speedSlider" min="5" max="60" step="1" value="60">
  </div>
  <div class="control-group">
    <label>Decay<span class="val" id="decayVal">0.96</span></label>
    <input type="range" id="decaySlider" min="0.80" max="0.99" step="0.01" value="0.96">
  </div>
  <div class="control-group">
    <label>Diffusion<span class="val" id="diffVal">0.60</span></label>
    <input type="range" id="diffSlider" min="0" max="1" step="0.05" value="0.60">
  </div>
  <div class="control-group">
    <label>Sensor Angle<span class="val" id="saVal">45°</span></label>
    <input type="range" id="saSlider" min="10" max="90" step="1" value="45">
  </div>
  <div class="control-group">
    <label>Rotation Angle<span class="val" id="raVal">20°</span></label>
    <input type="range" id="raSlider" min="5" max="90" step="1" value="20">
  </div>
  <div class="control-group">
    <label>Step Size<span class="val" id="stepVal">1.5</span></label>
    <input type="range" id="stepSlider" min="0.1" max="5.0" step="0.1" value="1.5">
  </div>

  <hr class="div">
  
  <div class="control-group">
    <button id="recordGifBtn" class="btn-primary">Record 10s GIF</button>
    <div id="gif-status" class="status-text"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script>
// ── Params & Globals ──────────────────────────────────────────────────────────
const AGENTS_PER_LETTER = 2000;
const SENSOR_DIST       = 10;
const TRAIL_R = 255, TRAIL_G = 255, TRAIL_B = 255;  

let textSeed        = "BIODESIGN";
let textSizeVal     = 120;
let textPosX        = 0.5; 
let textPosY        = 0.5; 

let simSpeed        = 60; 
let decayFactor     = 0.96;
let diffusionFactor = 0.60; 
let sensorAngle     = Math.PI / 4;
let rotationAngle   = 20 * Math.PI / 180; 
let stepSize        = 1.5;

let seedMode      = "text";   
let uploadedImage = null;     
let edgeMode      = "fill";   

// Background Variables
let bgR = 0, bgG = 255, bgB = 0;
let rawBgImage = null;    // Original uploaded image file
let bgImageData = null;   // Processed pixel array matching the canvas size

let letterBuf;      
let allAgents = [];
let skeletonPixels = []; 
let trailR, trailG, trailB; 
let spawnTime = 0; 

// ── Helper: Hex to RGB ────────────────────────────────────────────────────────
function hexToRgb(hex) {
  let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return result ? {
    r: parseInt(result[1], 16),
    g: parseInt(result[2], 16),
    b: parseInt(result[3], 16)
  } : null;
}

function rgbToHex(r, g, b) {
  return "#" + (1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1).toUpperCase();
}

// ── Image Processing Logic for Custom Backgrounds ──────────────────────────────
function handleBgFile(file) {
  if (!file) return;
  if (file instanceof FileList) file = file[0];
  if (!(file instanceof Blob)) return;

  const img = new Image();
  img.src = URL.createObjectURL(file);
  img.onload = () => {
      rawBgImage = img;
      processBgImage();
      document.getElementById('bg-clear-btn').style.display = 'block';
      document.getElementById('bg-upload-btn').innerText = 'Change Image';
  };
}

// Maps the uploaded image perfectly onto the canvas dimensions
function processBgImage() {
  if (!rawBgImage) return;
  const offC = document.createElement("canvas");
  offC.width = width; 
  offC.height = height;
  const ctx = offC.getContext("2d");
  
  // Scale the image to cover the canvas proportionally
  const scale = Math.max(width / rawBgImage.naturalWidth, height / rawBgImage.naturalHeight);
  const dw = rawBgImage.naturalWidth * scale;
  const dh = rawBgImage.naturalHeight * scale;
  const dx = (width - dw) / 2;
  const dy = (height - dh) / 2;
  
  ctx.drawImage(rawBgImage, dx, dy, dw, dh);
  bgImageData = ctx.getImageData(0, 0, width, height).data;
}

// ── UI Setup & Event Listeners ────────────────────────────────────────────────
window.addEventListener("DOMContentLoaded", () => {
  
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tab-pane").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      
      const tabPane = document.getElementById(btn.dataset.tab);
      if (tabPane) tabPane.classList.add("active");
      
      seedMode = btn.dataset.tab === "image-tab" ? "image" : "text";
      if (typeof spawnAgents === "function") spawnAgents();
    });
  });

  const colorPicker = document.getElementById("bgColorPicker");
  const hexInput = document.getElementById("bgHexInput");

  function updateBackground(hexVal) {
    const rgb = hexToRgb(hexVal);
    if (rgb) {
      bgR = rgb.r;
      bgG = rgb.g;
      bgB = rgb.b;
      colorPicker.value = hexVal;
      hexInput.value = hexVal.toUpperCase();
      document.documentElement.style.setProperty('--bg', hexVal);
    }
  }

  colorPicker.addEventListener("input", (e) => {
    updateBackground(e.target.value);
  });

  hexInput.addEventListener("change", (e) => {
    let val = e.target.value.trim();
    if (!val.startsWith('#')) val = '#' + val;
    if (/^#[0-9A-F]{6}$/i.test(val)) {
      updateBackground(val);
    } else {
      hexInput.value = rgbToHex(bgR, bgG, bgB);
    }
  });

  // Background Image Triggers
  const bgUploadBtn = document.getElementById("bg-upload-btn");
  const bgFileInput = document.getElementById("bg-file-input");
  const bgClearBtn = document.getElementById("bg-clear-btn");

  if (bgUploadBtn && bgFileInput) {
    bgUploadBtn.addEventListener("click", () => bgFileInput.click());
    bgFileInput.addEventListener("change", e => {
      if (e.target.files?.length > 0) handleBgFile(e.target.files[0]);
    });
  }

  if (bgClearBtn) {
    bgClearBtn.addEventListener("click", () => {
      rawBgImage = null;
      bgImageData = null;
      bgClearBtn.style.display = "none";
      bgUploadBtn.innerText = "Upload Image";
      bgFileInput.value = "";
    });
  }

  document.querySelectorAll('input[name="edge-mode"]').forEach(r => {
    r.addEventListener("change", e => { edgeMode = e.target.value; spawnAgents(); });
  });

  document.getElementById("textInput")?.addEventListener("input", e => { textSeed = e.target.value; spawnAgents(); });

  function bindSlider(id, valId, setter, suffix = "") {
    const s = document.getElementById(id), v = document.getElementById(valId);
    if (s && v) s.addEventListener("input", e => { v.innerText = e.target.value + suffix; setter(+e.target.value); });
  }
  
  bindSlider("textSizeSlider", "textSizeVal", x => { textSizeVal = x; spawnAgents(); });
  bindSlider("textXSlider", "textXVal", x => { textPosX = x / 100; spawnAgents(); }, "%");
  bindSlider("textYSlider", "textYVal", x => { textPosY = x / 100; spawnAgents(); }, "%");

  bindSlider("speedSlider", "speedVal", x => { simSpeed = x; frameRate(simSpeed); }, " fps");
  bindSlider("decaySlider", "decayVal", x => decayFactor = x);
  bindSlider("diffSlider",  "diffVal",  x => diffusionFactor = x);
  bindSlider("saSlider",    "saVal",    x => sensorAngle = x * Math.PI / 180, "°");
  bindSlider("raSlider",    "raVal",    x => rotationAngle = x * Math.PI / 180, "°");
  bindSlider("stepSlider",  "stepVal",  x => stepSize = x);

  const dropZone  = document.getElementById("drop-zone");
  const fileInput = document.getElementById("file-input");
  const imgClear  = document.getElementById("img-clear");

  if (imgClear) {
    imgClear.addEventListener("click", e => {
      e.stopPropagation();
      uploadedImage = null;
      document.getElementById("img-preview-wrap").style.display = "none";
      document.getElementById("img-preview").src = "";
      document.getElementById("img-status").textContent = "";
      fileInput.value = "";
      if (seedMode === "image" && typeof spawnAgents === "function") spawnAgents();
    });
  }

  if (dropZone && fileInput) {
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, e => { e.preventDefault(); e.stopPropagation(); });
    });
    dropZone.addEventListener("click", () => fileInput.click());
    dropZone.addEventListener("dragover", () => dropZone.classList.add("drag-over"));
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("drag-over"));
    dropZone.addEventListener("drop", e => {
      dropZone.classList.remove("drag-over");
      if (e.dataTransfer.files?.length > 0) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener("change", e => {
      if (e.target.files?.length > 0) handleFile(e.target.files[0]);
    });
  }

  // GIF Recording Configuration
  const recordBtn = document.getElementById("recordGifBtn");
  const gifStatus = document.getElementById("gif-status");
  if (recordBtn) {
    recordBtn.addEventListener("click", () => {
      recordBtn.disabled = true;
      recordBtn.innerText = "Recording...";
      gifStatus.innerText = "Capturing 10s at 15fps (browser may freeze)...";
      
      frameRate(15);
      saveGif('physarum-typography', 10, { units: 'seconds' });

      setTimeout(() => {
        frameRate(simSpeed); 
        recordBtn.disabled = false;
        recordBtn.innerText = "Record 10s GIF";
        gifStatus.innerText = "GIF Downloaded!";
        setTimeout(() => gifStatus.innerText = "", 4000);
      }, 15000); 
    });
  }
});

function handleFile(file) {
  if (!file) return;
  if (file instanceof FileList) file = file[0];
  if (!(file instanceof Blob)) return;

  const imgStatus = document.getElementById("img-status");
  imgStatus.textContent = "Loading image...";
  const img = new Image();
  img.src = URL.createObjectURL(file);
  img.onload = () => {
      uploadedImage = img;
      document.getElementById("img-preview").src = img.src;
      document.getElementById("img-preview-wrap").style.display = "block";
      imgStatus.textContent = `${img.naturalWidth}×${img.naturalHeight}px — loaded`;
      seedMode = "image";
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === "image-tab"));
      document.querySelectorAll(".tab-pane").forEach(p => p.classList.toggle("active", p.id === "image-tab"));
      setTimeout(() => { if (typeof spawnAgents === "function") spawnAgents(); }, 50);
  };
  img.onerror = () => {
    imgStatus.textContent = "Image read error.";
    imgStatus.style.color = "#f66";
  }
}

// ── p5 sketch ─────────────────────────────────────────────────────────────────
function setup() {
  createCanvas(windowWidth, windowHeight);
  pixelDensity(1);
  frameRate(simSpeed); 
  initTrailBuffer();
  letterBuf = createGraphics(width, height);
  
  if (document.fonts) {
    document.fonts.load('120px "Bai Jamjuree Local"').then(() => {
      spawnAgents();
    }).catch(() => {
      spawnAgents();
    });
  } else {
    setTimeout(spawnAgents, 500);
  }
}

function initTrailBuffer() {
  const n = width * height;
  trailR = new Float32Array(n); trailG = new Float32Array(n); trailB = new Float32Array(n);
}

function depositTrail(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  if (xi < 0 || xi >= width || yi < 0 || yi >= height) return;
  const idx = xi + yi * width;
  trailR[idx] = Math.min(255, trailR[idx] + TRAIL_R);
  trailG[idx] = Math.min(255, trailG[idx] + TRAIL_G);
  trailB[idx] = Math.min(255, trailB[idx] + TRAIL_B);
}

function senseTrail(sx, sy) {
  const xi = Math.floor(sx), yi = Math.floor(sy);
  if (xi < 0 || xi >= width || yi < 0 || yi >= height) return 0;
  return trailR[xi + yi * width]; 
}

function updateTrailBuffer() {
  const w = width, h = height;
  const newR = new Float32Array(w * h); const newG = new Float32Array(w * h); const newB = new Float32Array(w * h);
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      let sumR = 0, sumG = 0, sumB = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const i = (x + dx) + (y + dy) * w;
        sumR += trailR[i]; sumG += trailG[i]; sumB += trailB[i];
      }
      const idx = x + y * w;
      newR[idx] = (sumR / 9 * diffusionFactor + trailR[idx] * (1 - diffusionFactor)) * decayFactor;
      newG[idx] = (sumG / 9 * diffusionFactor + trailG[idx] * (1 - diffusionFactor)) * decayFactor;
      newB[idx] = (sumB / 9 * diffusionFactor + trailB[idx] * (1 - diffusionFactor)) * decayFactor;
    }
  }
  trailR = newR; trailG = newG; trailB = newB;
}

function renderTrailToCanvas() {
  loadPixels();
  const n = width * height;
  
  for (let i = 0; i < n; i++) {
    const pi = i * 4;
    
    // UPDATED: Check if a background image exists. If yes, paint it. Otherwise paint solid color.
    if (bgImageData && bgImageData.length > pi) {
      pixels[pi]   = bgImageData[pi];     
      pixels[pi+1] = bgImageData[pi+1]; 
      pixels[pi+2] = bgImageData[pi+2];   
      pixels[pi+3] = 255; 
    } else {
      pixels[pi]   = bgR;     
      pixels[pi+1] = bgG; 
      pixels[pi+2] = bgB;   
      pixels[pi+3] = 255; 
    }
  }
  
  for (const p of skeletonPixels) {
    const pi = (p.x + p.y * width) * 4;
    pixels[pi] = 72; pixels[pi+1] = 180; pixels[pi+2] = 147; 
    pixels[pi+3] = 255; 
  }
  
  for (let i = 0; i < n; i++) {
    const pi = i * 4;
    const intensity = Math.max(trailR[i], trailG[i], trailB[i]);
    
    if (intensity > 5) {
      pixels[pi]   = Math.max(pixels[pi], Math.min(trailR[i], 255));
      pixels[pi+1] = Math.max(pixels[pi+1], Math.min(trailG[i], 255));
      pixels[pi+2] = Math.max(pixels[pi+2], Math.min(trailB[i], 255));
      pixels[pi+3] = 255; 
    }
  }
  updatePixels();
}

function draw() {
  if (millis() - spawnTime > 1000) {
    for (const a of allAgents) a.update();
  }
  
  for (const a of allAgents) depositTrail(a.pos.x, a.pos.y);
  updateTrailBuffer();
  renderTrailToCanvas();
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  initTrailBuffer();
  if (letterBuf) letterBuf.remove();
  letterBuf = createGraphics(width, height);
  if (rawBgImage) processBgImage(); // Recalculate background image scaling
  spawnAgents();
}

function spawnAgents() {
  allAgents = []; skeletonPixels = []; initTrailBuffer();
  const W = letterBuf.width, H = letterBuf.height;

  if (seedMode === "text") {
    letterBuf.clear(); 
    letterBuf.textAlign(CENTER, CENTER);
    letterBuf.textFont("'Bai Jamjuree Local'"); 
    letterBuf.textStyle(NORMAL); 
    
    letterBuf.textSize(textSizeVal);
    letterBuf.textLeading(textSizeVal * 1.15); 
    letterBuf.fill(255); 
    
    letterBuf.text(textSeed, W * textPosX, H * textPosY);
    
    letterBuf.loadPixels();

    for (let py = 1; py < H - 1; py++) {
      for (let px = 1; px < W - 1; px++) {
        const idx = 4 * (px + py * W);
        if (letterBuf.pixels[idx + 3] > 128) {
          if (edgeMode === "edge") {
            let isEdge = false;
            outer: for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
              if (!dx && !dy) continue;
              if (letterBuf.pixels[4 * ((px+dx) + (py+dy) * W) + 3] < 128) { isEdge = true; break outer; }
            }
            if (isEdge) skeletonPixels.push({ x: px, y: py });
          } else {
            skeletonPixels.push({ x: px, y: py });
          }
        }
      }
    }
  } else if (seedMode === "image" && uploadedImage) {
    const offC = document.createElement("canvas");
    offC.width = width; offC.height = height;
    const ctx = offC.getContext("2d");
    ctx.clearRect(0, 0, width, height);
    const scale = Math.min(width / uploadedImage.naturalWidth, height / uploadedImage.naturalHeight);
    if (scale && scale !== Infinity) {
      const dw = uploadedImage.naturalWidth * scale;
      const dh = uploadedImage.naturalHeight * scale;
      ctx.drawImage(uploadedImage, (width - dw) / 2, (height - dh) / 2, dw, dh);
      const data = ctx.getImageData(0, 0, width, height).data;
      const isInside = i => data[i+3] > 50 && (data[i] + data[i+1] + data[i+2]) < 720;
      
      if (edgeMode === "edge") {
        for (let py = 1; py < height - 1; py++) {
          for (let px = 1; px < width - 1; px++) {
            if (!isInside(4*(px + py*width))) continue;
            let edge = false;
            outer: for (let dy=-1; dy<=1; dy++) for (let dx=-1; dx<=1; dx++) {
              if (!dx && !dy) continue;
              if (!isInside(4*((px+dx)+(py+dy)*width))) { edge=true; break outer; }
            }
            if (edge) skeletonPixels.push({x:px, y:py});
          }
        }
      } else {
        for (let py = 0; py < height; py++) for (let px = 0; px < width; px++) {
          if (isInside(4*(px+py*width))) skeletonPixels.push({x:px, y:py});
        }
      }
    }
  }
  
  const charCount = Math.max(1, textSeed.replace(/\n/g, '').trim().length);
  const total = AGENTS_PER_LETTER * charCount;
  
  for (let i = 0; i < total; i++) {
    const bp = skeletonPixels[Math.floor(Math.random() * skeletonPixels.length)];
    if(bp) allAgents.push(new Agent(bp.x + random(-1,1), bp.y + random(-1,1), random(TWO_PI)));
  }
  
  spawnTime = millis();
}

class Agent {
  constructor(x, y, angle) {
    this.pos          = createVector(x, y);
    this.angle        = angle;
    this.turnVelocity = 0; 
  }
  update() {
    const sL = this._sense(this.angle - sensorAngle);
    const sC = this._sense(this.angle);
    const sR = this._sense(this.angle + sensorAngle);

    let targetTurn = 0;

    if      (sL > sC && sL > sR) targetTurn = -rotationAngle;
    else if (sR > sC && sR > sL) targetTurn = rotationAngle;
    else                         targetTurn = random(-0.05, 0.05);

    this.turnVelocity = lerp(this.turnVelocity, targetTurn, 0.2);
    this.angle += this.turnVelocity;

    this.pos.x = (this.pos.x + Math.cos(this.angle) * stepSize + width)  % width;
    this.pos.y = (this.pos.y + Math.sin(this.angle) * stepSize + height) % height;
  }
  _sense(angle) {
    return senseTrail(
      this.pos.x + Math.cos(angle) * SENSOR_DIST,
      this.pos.y + Math.sin(angle) * SENSOR_DIST
    );
  }
}
</script>
